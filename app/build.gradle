plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

// Release signing is opt-in: supply a gitignored keystore.properties at the repo root.
// Without it, release builds produce an unsigned APK (and CI/debug builds are unaffected).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def hasReleaseSigning = keystorePropertiesFile.exists() &&
        keystoreProperties['storeFile'] && keystoreProperties['storePassword'] &&
        keystoreProperties['keyAlias'] && keystoreProperties['keyPassword']

def configuredPin = (project.findProperty("ADVDISPLAY_ADMIN_PIN") ?: System.getenv("ADVDISPLAY_ADMIN_PIN") ?: "").toString()
def adminPinRaw = configuredPin ?: "1234"
def adminPinEscaped = adminPinRaw.replace("\\", "\\\\").replace("\"", "\\\"")
def apiBaseUrl = (project.findProperty("ADVDISPLAY_BASE_URL") ?: System.getenv("ADVDISPLAY_BASE_URL") ?: "https://sds.par-crm.com/").toString()
def parsedBaseUrl = new URI(apiBaseUrl)
if (!(parsedBaseUrl.scheme in ['https', 'http']) || !parsedBaseUrl.host || parsedBaseUrl.userInfo || parsedBaseUrl.query || parsedBaseUrl.fragment) {
    throw new GradleException('ADVDISPLAY_BASE_URL must be an HTTP(S) base URL without credentials, query or fragment.')
}
if (!apiBaseUrl.endsWith('/')) apiBaseUrl += '/'

android {
    compileSdk = 33

    defaultConfig {
        applicationId = "com.rihlahidali.advdisplay"
        minSdk = 22
        targetSdk = 33
        // Versioning: versionCode = MAJOR*10000 + MINOR*100 + PATCH (see docs/VERSIONING.md).
        versionCode = 10000
        versionName = "1.0.0"

        multiDexEnabled = true
        // Configure with -PADVDISPLAY_ADMIN_PIN=... or ADVDISPLAY_ADMIN_PIN env var.
        buildConfigField "String", "ADMIN_PIN", "\"${adminPinEscaped}\""
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        buildConfig = true
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        allWarningsAsErrors = true
    }
    testOptions {
        animationsDisabled = true
    }
    lint {
        abortOnError = true
        htmlReport = true
        xmlReport = true
        lintConfig = file('lint.xml')
    }
    namespace = 'com.rihlahidali.advdisplay'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Architecture Components
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.10.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.10.0'


    // Glide
    implementation 'com.github.bumptech.glide:glide:4.15.1'

    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.10.0'

}

tasks.register('validateReleaseConfiguration') {
    doLast {
        if (!(configuredPin ==~ /[0-9]{4,12}/) || configuredPin == '1234') {
            throw new GradleException('Release builds require ADVDISPLAY_ADMIN_PIN with 4-12 digits, different from 1234.')
        }
        if (parsedBaseUrl.scheme != 'https') {
            throw new GradleException('Release builds require an HTTPS ADVDISPLAY_BASE_URL.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn('validateReleaseConfiguration') }

// Keeps versionCode and versionName from drifting apart (see docs/VERSIONING.md).
tasks.register('validateVersioning') {
    group = 'verification'
    description = 'Fails if versionCode does not match the versionName semver encoding.'
    doLast {
        def name = android.defaultConfig.versionName?.toString()
        def code = android.defaultConfig.versionCode
        def match = name =~ /^(\d+)\.(\d+)\.(\d+)$/
        if (!match.matches()) {
            throw new GradleException(
                "versionName '${name}' must be MAJOR.MINOR.PATCH (for example 1.0.0) per docs/VERSIONING.md.")
        }
        def major = match[0][1] as int
        def minor = match[0][2] as int
        def patch = match[0][3] as int
        if (minor > 99 || patch > 99) {
            throw new GradleException(
                "versionName '${name}': MINOR and PATCH must be 0-99 so versionCode stays derivable.")
        }
        def expected = major * 10000 + minor * 100 + patch
        if (code != expected) {
            throw new GradleException(
                "versionCode ${code} does not match versionName '${name}' (expected ${expected} " +
                "= MAJOR*10000 + MINOR*100 + PATCH). Update both together; see docs/VERSIONING.md.")
        }
    }
}
